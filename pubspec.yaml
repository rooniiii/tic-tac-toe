name: tic_tac_toe
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.8
  shared_preferences: ^2.5.3
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  audioplayers: ^6.6.0
  flutter_tts: ^4.2.5

  # Firebase Packages
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_app_check: ^0.4.9
  intl_phone_field: ^3.2.0
  phone_numbers_parser: ^9.0.29

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/button.mp3.mpeg
    - assets/audio/move.mp3.mpeg
    - assets/audio/congrats.mp3.mp4
    - assets/audio/winning.mp3.mp4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#100B20"
  adaptive_icon_foreground: "assets/icon/app_icon.jpeg"